name: mesh crypto

on:
  push:
    branches: [master, main]
    paths:
      - 'apps/mesh/**'
      - 'include/**'
      - 'src/**'
      - 'xmake.lua'
      - '.github/workflows/mesh.yml'
  pull_request:
    paths:
      - 'apps/mesh/**'
      - 'include/**'
      - 'src/**'
      - 'xmake.lua'
      - '.github/workflows/mesh.yml'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.target.os }} / ${{ matrix.mode }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, release]
        target:
          - { os: ubuntu-latest, plat: linux, toolchain: gcc }
          - { os: macos-latest, plat: macosx, toolchain: clang }
          - { os: windows-latest, plat: windows, toolchain: msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1.2.5
        with:
          xmake-version: latest
      - name: configure isolated mesh project
        run: xmake f -P apps/mesh -m ${{ matrix.mode }} -p ${{ matrix.target.plat }} --toolchain=${{ matrix.target.toolchain }} -y
      - name: run mesh protocol tests
        shell: bash
        run: bash .github/report-failure.sh xmake test -P apps/mesh -v
      - name: build mesh command
        shell: bash
        run: bash .github/report-failure.sh xmake build -P apps/mesh mesh
      - name: exercise encrypted peer command
        shell: bash
        run: |
          if [ "${{ runner.os }}" = Windows ]; then
            bash .github/report-failure.sh python apps/mesh/tests/peer_probe.py ${{ matrix.mode }}
            bash .github/report-failure.sh python apps/mesh/tests/peer_probe.py ${{ matrix.mode }} --stun-unavailable
          else
            bash .github/report-failure.sh python3 apps/mesh/tests/peer_probe.py ${{ matrix.mode }}
            bash .github/report-failure.sh python3 apps/mesh/tests/peer_probe.py ${{ matrix.mode }} --stun-unavailable
          fi
      - name: exercise macOS utun mesh forwarding
        if: matrix.target.plat == 'macosx'
        shell: bash
        run: bash .github/report-failure.sh python3 apps/mesh/tests/tunnel_macos.py ${{ matrix.mode }}

  linux-network-integration:
    name: Linux network namespaces / NAT / TUN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1.2.5
        with:
          xmake-version: latest
      - name: install network test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables iputils-ping
      - name: verify runner network privileges
        shell: bash
        run: |
          sudo modprobe tun
          sudo test -c /dev/net/tun
          probe="mesh-ci-${{ github.run_id }}"
          sudo ip netns add "$probe"
          sudo ip netns del "$probe"
      - name: build Linux mesh command
        shell: bash
        run: |
          xmake f -P apps/mesh -m debug -p linux --toolchain=gcc -y
          bash .github/report-failure.sh xmake build -P apps/mesh mesh
      - name: encrypted peer data through two NATs
        shell: bash
        run: bash .github/report-failure.sh sudo python3 apps/mesh/tests/tunnel_nat.py --probe
      - name: encrypted peer data with translated NAT ports
        shell: bash
        run: bash .github/report-failure.sh sudo python3 apps/mesh/tests/tunnel_nat.py --probe --non-preserving
      - name: TUN traffic after NAT mapping changes
        shell: bash
        run: bash .github/report-failure.sh sudo python3 apps/mesh/tests/tunnel_nat.py
      - name: TUN traffic after translated NAT port changes
        shell: bash
        run: bash .github/report-failure.sh sudo python3 apps/mesh/tests/tunnel_nat.py --non-preserving
      - name: TUN traffic after peer restart
        shell: bash
        run: bash .github/report-failure.sh sudo python3 apps/mesh/tests/tunnel_ns.py --restart
      - name: TUN traffic after underlay address changes
        shell: bash
        run: bash .github/report-failure.sh sudo python3 apps/mesh/tests/tunnel_ns.py --address-change
