name: mesh crypto

on:
  push:
    branches: [master, main]
    paths:
      - 'apps/mesh/**'
      - 'include/**'
      - 'src/**'
      - 'xmake.lua'
      - '.github/workflows/mesh.yml'
  pull_request:
    paths:
      - 'apps/mesh/**'
      - 'include/**'
      - 'src/**'
      - 'xmake.lua'
      - '.github/workflows/mesh.yml'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.mode }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        mode: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1.2.5
        with:
          xmake-version: latest
      - name: configure isolated mesh project
        shell: bash
        run: |
          printf 'y\n' | xmake f -P apps/mesh -m ${{ matrix.mode }} -y
      - name: run authenticated-offer tests
        shell: bash
        run: bash .github/report-failure.sh xmake test -P apps/mesh -v
