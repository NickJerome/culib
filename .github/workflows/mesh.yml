name: mesh crypto

on:
  push:
    branches: [master, main]
    paths:
      - 'apps/mesh/**'
      - 'include/**'
      - 'src/**'
      - 'xmake.lua'
      - '.github/workflows/mesh.yml'
  pull_request:
    paths:
      - 'apps/mesh/**'
      - 'include/**'
      - 'src/**'
      - 'xmake.lua'
      - '.github/workflows/mesh.yml'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.target.os }} / ${{ matrix.mode }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, release]
        target:
          - { os: ubuntu-latest, plat: linux, toolchain: gcc }
          - { os: macos-latest, plat: macosx, toolchain: clang }
          - { os: windows-latest, plat: windows, toolchain: msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1.2.5
        with:
          xmake-version: latest
      - name: configure isolated mesh project
        run: xmake f -P apps/mesh -m ${{ matrix.mode }} -p ${{ matrix.target.plat }} --toolchain=${{ matrix.target.toolchain }} -y
      - name: run mesh protocol tests
        shell: bash
        run: bash .github/report-failure.sh xmake test -P apps/mesh -v
      - name: build mesh command
        shell: bash
        run: bash .github/report-failure.sh xmake build -P apps/mesh mesh
      - name: exercise macOS utun mesh forwarding
        if: matrix.target.plat == 'macosx'
        shell: bash
        run: bash .github/report-failure.sh python3 apps/mesh/tests/tunnel_macos.py ${{ matrix.mode }}
