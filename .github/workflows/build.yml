name: build

# README 的「平台与工具链」承诺三个平台行为一致、「开发约定」承诺零警告。
# 这个 workflow 是那两条承诺的执行机制 —— 手工只能覆盖一个平台一种编译器。
#
# 需要 GitHub 的托管 runner（ubuntu / windows / macos 三种标签）。主仓库在自建 Gitea 上时，
# 用 Gitea 的 Push Mirror 自动镜像到一个 GitHub 仓库来跑它，配置办法见
# docs/superpowers/specs/2026-10-03-roadmap.md 第 5 节。

on:
  push:
    # 两个都认：主仓库在 Gitea 上用 master，GitHub 的默认分支名是 main。
    # 只写一个的话，哪天分支改名 CI 就静默不跑了。
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  XMAKE_VERSION: '3.1.1'

jobs:
  mingw-x86_64:
    name: MinGW x86_64 C++11
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc python
      - name: build 64-bit tests and examples, run tests
        shell: msys2 {0}
        run: CXX=g++ bash .github/report-failure.sh bash tests/mingw_windows.sh

  legacy-gcc:
    name: GCC 4.8 C++11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # 官方 gcc:4.8.5 镜像：Debian 7、glibc 2.13，GCC 从源码编译。gcc:4.8 这个标签还是 schema 1 的清单，
      # 新版 Docker 拉不了。按摘要固定。
      - name: build and test with GCC 4.8
        shell: bash
        run: bash .github/report-failure.sh docker run --rm -v "$PWD:/workspace" -w /workspace gcc:4.8.5@sha256:a515c9a2b8bf7d0f91470f7315be90862e249e6f4caa9f0d71898d3f2be8c280 bash tests/legacy_gcc48.sh

  # 两条开发约定原先只有人工流程、没有机制：公共头文件带 UTF-8 BOM、每个头文件能单独包含。
  # 都只需要一个 Linux runner，所以合成一个快速门禁，排在编译矩阵前面。
  headers:
    name: public headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: test CI output reporting
        run: bash .github/report-failure.sh python3 -m unittest discover -s tests -p ci_report_test.py

      # 头文件里有中文注释。使用方在非 UTF-8 代码页（如中文 Windows 的 936）下不加 /utf-8
      # 编译时，MSVC 会对每个头文件报 C4819，开了 /WX 就是编译失败。BOM 让文件自己说明编码，
      # 不需要使用方加任何标志 —— culib 自己的 set_encodings("utf-8") 管不到使用方的编译单元。
      - name: every public header starts with a UTF-8 BOM
        run: |
          missing=$(find include -name '*.h' -print0 \
            | xargs -0 -I{} sh -c 'head -c3 "{}" | od -An -tx1 | tr -d " \n" | grep -q efbbbf || echo "{}"')
          if [ -n "$missing" ]; then
            echo "缺少 UTF-8 BOM："; echo "$missing"
            echo "修法：python3 -c \"import pathlib,sys; p=pathlib.Path(sys.argv[1]); b=p.read_bytes(); p.write_bytes(b'\\xef\\xbb\\xbf'+b)\" <文件>"
            exit 1
          fi
          echo "全部带 BOM：$(find include -name '*.h' | wc -l) 个"

      - name: every public header compiles on its own
        run: |
          status=0
          for header in $(find include -name '*.h' | sed 's|^include/||' | sort); do
            printf '#include <%s>\nint main() { return 0; }\n' "$header" > /tmp/standalone.cpp
            if g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror -Iinclude \
                   -fsyntax-only /tmp/standalone.cpp; then
              echo "  ok    $header"
            else
              echo "  FAIL  $header"; status=1
            fi
          done
          exit $status

  no-exceptions-rtti:
    name: Linux ${{ matrix.toolchain }} C++11 without exceptions or RTTI
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - uses: xmake-io/github-action-setup-xmake@v1.2.5
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}
          actions-cache-folder: '.xmake-tool-cache'
      - name: configure without exceptions or RTTI
        run: xmake f -m release --toolchain=${{ matrix.toolchain }} --cxxflags="-fno-exceptions -fno-rtti" --ccache=n -y
      - name: build library
        shell: bash
        run: bash .github/report-failure.sh xmake -y
      - name: run tests
        shell: bash
        run: bash .github/report-failure.sh xmake test -v
      - name: build examples
        shell: bash
        run: bash .github/report-failure.sh xmake build -y -g examples

  sanitizers:
    name: Linux GCC ASan + UBSan + TSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: xmake-io/github-action-setup-xmake@v1.2.5
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}
          actions-cache-folder: '.xmake-tool-cache'
      - name: configure with sanitizers
        run: xmake f -m debug --toolchain=gcc --cxxflags="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" --ldflags="-fsanitize=address,undefined" --ccache=n -y
      - name: build library and tests
        shell: bash
        run: bash .github/report-failure.sh xmake build -y culib_test
      - name: run tests under ASan and UBSan
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          CULIB_CI_STRICT: '1'
        # ASan 自己接管 malloc/new；全局覆盖计数测试在此配置下无法观察 culib 的入口。
        # 该覆盖测试仍在普通 Linux debug/release 作业中执行。
        run: bash .github/report-failure.sh xmake test -v culib_test/default runtime_order_test/default os_stop_test/threads os_stop_test/sigint os_stop_test/sigterm mem_test_abandoned/default mem_test_new_override/default mem_test_rss/default mem_test_security/default mem_test_stress/default mem_test_unit/default
      - name: check stop requests under ThreadSanitizer
        shell: bash
        env:
          TSAN_OPTIONS: halt_on_error=1
          CULIB_CI_STRICT: '1'
        run: |
          bash .github/report-failure.sh bash -e -c '
            g++ -std=c++11 -O1 -g -Wall -Wextra -Wpedantic -Werror -pthread -fsanitize=thread -Iinclude \
              tests/process/os_stop.cpp src/platform/os.cpp src/platform/os_posix.cpp \
              src/base/result.cpp src/base/string_view.cpp src/base/optional.cpp src/base/fatal.cpp \
              -o build/os_stop_tsan
            for mode in threads sigint sigterm; do
              setarch "$(uname -m)" -R build/os_stop_tsan "$mode"
            done
          '
      - name: run the runtime under ThreadSanitizer
        shell: bash
        timeout-minutes: 30
        env:
          TSAN_OPTIONS: halt_on_error=0:second_deadlock_stack=1
          CULIB_CI_STRICT: '1'
        # 协程换栈按 TSan 的 fiber 接口标注过（src/runtime/coroutine.cpp）。两个程序都跑完再判结果，
        # 一次看全所有报告；有报告时 TSan 以 66 退出，CULIB_CI_STRICT 也会拦。
        # setarch -R 关掉地址随机化：runner 的内核随机位数多，映射可能落到 TSan 留给影子内存的地址上，
        # 和上一步一样。
        run: |
          xmake f -m debug --toolchain=gcc --cxxflags="-fsanitize=thread -fno-omit-frame-pointer" --ldflags="-fsanitize=thread" --ccache=n -y
          bash .github/report-failure.sh xmake build -y culib_test runtime_order_test
          status=0
          for program in culib_test runtime_order_test; do
            bash .github/report-failure.sh setarch "$(uname -m)" -R "build/linux/x86_64/debug/$program" || status=1
          done
          exit $status

  build:
    name: ${{ matrix.target.name }} / ${{ matrix.mode }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      # 一个平台失败不打断其他平台，一次就能看到全部结果
      fail-fast: false
      matrix:
        mode: [debug, release]
        target:
          - { name: linux-gcc, os: ubuntu-latest, toolchain: gcc }
          - { name: linux-clang, os: ubuntu-latest, toolchain: clang }
          - { name: linux-gcc-arm64, os: ubuntu-24.04-arm, toolchain: gcc }
          - { name: macos-clang, os: macos-latest, toolchain: clang }
          - { name: macos-clang-x86_64, os: macos-15-intel, toolchain: clang }
          - { name: windows-msvc, os: windows-latest, toolchain: msvc }

    steps:
      - uses: actions/checkout@v5

      - name: identify compiler cache
        id: compiler-cache
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ${{ matrix.target.toolchain }} --version | python3 -c 'import hashlib, os, sys; value = os.environ.get("ImageVersion", "") + sys.stdin.read(); print("id=" + hashlib.sha256(value.encode()).hexdigest())' >> "$GITHUB_OUTPUT"

      # 注意仓库名是 github-action-setup-xmake，不是 setup-xmake（后者不存在）
      - uses: xmake-io/github-action-setup-xmake@v1.2.5
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}
          actions-cache-folder: '.xmake-tool-cache'
          build-cache: ${{ runner.os != 'Windows' }}
          build-cache-key: v1-${{ matrix.target.os }}-${{ matrix.target.toolchain }}-${{ steps.compiler-cache.outputs.id }}-${{ matrix.mode }}-xmake-${{ env.XMAKE_VERSION }}-${{ hashFiles('xmake.lua', 'tests/xmake.lua', 'examples/xmake.lua', 'src/mem/xmake.lua', 'tests/mem/xmake.lua') }}

      - name: configure
        run: xmake f -m ${{ matrix.mode }} --toolchain=${{ matrix.target.toolchain }} -y

      # 命令输出由 report-failure.sh 提取并发布，查询方式见 docs/ci.md。

      # xmake 默认显示警告；xmake.lua 将三平台编译警告视为错误。
      - name: build library
        shell: bash
        run: bash .github/report-failure.sh xmake -y

      - name: run tests
        shell: bash
        # 成功和失败都打印测试输出，供报告脚本提取。
        run: bash .github/report-failure.sh xmake test -v

      # 示例默认不参与构建，这里显式编译：接口改了而示例没跟着改时就会在这一步失败。
      # 这一步抓到过 examples/os.cpp 的 std::fopen 在 MSVC 上是 C4996。
      - name: build examples
        shell: bash
        run: bash .github/report-failure.sh xmake build -y -g examples

      - name: run examples
        shell: bash
        run: bash .github/report-failure.sh xmake run example_result

  # 确认 culib 被当作源码依赖引入时能正常工作。
  # 这覆盖 xmake.lua 里 is_main_project 为假的那条分支（不强加 -Werror、不构建测试和示例），
  # 以及 README 的 C++11 接入方式与更高标准使用方。
  consumed-as-dependency:
    name: consumed as dependency / ${{ matrix.platform.name }} / ${{ matrix.standard }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: Linux, os: ubuntu-latest, toolchain: gcc }
          - { name: macOS, os: macos-latest, toolchain: clang }
          - { name: Windows, os: windows-latest, toolchain: msvc }
        standard: [c++11, c++17]
    steps:
      - uses: actions/checkout@v5
        with:
          path: culib

      - name: identify compiler cache
        id: compiler-cache
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ${{ matrix.platform.toolchain }} --version | python3 -c 'import hashlib, os, sys; value = os.environ.get("ImageVersion", "") + sys.stdin.read(); print("id=" + hashlib.sha256(value.encode()).hexdigest())' >> "$GITHUB_OUTPUT"

      # 注意仓库名是 github-action-setup-xmake，不是 setup-xmake（后者不存在）
      - uses: xmake-io/github-action-setup-xmake@v1.2.5
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}
          actions-cache-folder: '.xmake-tool-cache'
          build-cache: ${{ runner.os != 'Windows' }}
          build-cache-path: consumer/build/.build_cache
          build-cache-key: v1-consumer-${{ matrix.platform.os }}-${{ matrix.platform.toolchain }}-${{ steps.compiler-cache.outputs.id }}-${{ matrix.standard }}-release-xmake-${{ env.XMAKE_VERSION }}-${{ hashFiles('culib/xmake.lua', 'culib/src/mem/xmake.lua', 'culib/.github/workflows/build.yml') }}

      - name: create a consumer project
        shell: bash
        run: |
          mkdir -p consumer/src consumer/third_party/culib
          git -C culib archive HEAD | tar -x -C consumer/third_party/culib
          cat > consumer/xmake.lua <<'LUA'
          add_rules("mode.debug", "mode.release")
          -- MSVC 不提供 C++11 模式；最低即 C++14，不能传 -std:c++11。
          if not is_plat("windows") or "${{ matrix.standard }}" ~= "c++11" then
              set_languages("${{ matrix.standard }}")
          end

          includes("third_party/culib")

          target("consumer")
              set_kind("binary")
              set_warnings("allextra", "pedantic", "error")
              if is_plat("windows") and "${{ matrix.standard }}" == "c++17" then
                  add_cxflags("/Zc:__cplusplus")
              end
              add_files("src/*.cpp")
              add_deps("culib")
          LUA
          cat > consumer/src/main.cpp <<'CPP'
          #include <culib/culib.h>
          #include <cstdio>
          #include <string>
          #include <utility>
          #include <vector>
          #if __cplusplus >= 201703L
          #include <string_view>
          #include <type_traits>
          #endif

          static wavvix::result<int> checked_port(int port) {
              if (port < 1 || port > 65535) {
                  return wavvix::make_error(wavvix::error_kind::out_of_range, "bad port");
              }
              return port;
          }

          // 错误传播手写 if，不用宏：曾经有个 WAVVIX_TRY，因为藏了一个 return 被删掉了
          static wavvix::result<int> doubled_port(int port) {
              wavvix::result<int> checked = checked_port(port);
              if (checked.is_err()) {
                  return std::move(checked).error();
              }
              return checked.value() * 2;
          }

          int main() {
              defer { std::printf("done\n"); };
              wavvix::stopwatch watch;

              // 两种标准都使用相同的 culib API；C++17 还检查与标准 string_view 互操作。
          #if __cplusplus >= 201703L
              std::string_view standard = "from std::string_view";
              wavvix::string_view ours = standard;
              static_assert(!std::is_same<wavvix::string_view, std::string_view>::value,
                            "wavvix::string_view must stay a distinct type from std::string_view");
              wavvix::string_view empty = std::string_view();
              if (!empty.data() || empty.begin() != empty.end()) {
                  return 1;
              }
          #else
              wavvix::string_view ours = "from C++11";
          #endif

              int completed = 0;
              wavvix::wait_group group;
              group.go([&] { ++completed; });
              group.wait();
              if (completed != 1) {
                  return 1;
              }
              void* block = wavvix::mem::alloc(64);
              if (!block) {
                  return 1;
              }
              wavvix::mem::free(block);

              const wavvix::result<int> parsed = wavvix::lexical_cast<int>("42");
              const std::vector<wavvix::string_view> parts = wavvix::split("a,b,c", ',');
              const wavvix::result<wavvix::fs::path> temporary = wavvix::fs::temp_directory_path();
              const wavvix::fs::path archive("archive.tar.gz");

              const wavvix::result<int> port = doubled_port(8080);
              if (port.is_err()) {
                  std::fprintf(stderr, "%s\n", port.error().to_string().c_str());
                  return 1;
              }
              std::printf("culib %s port %d view %zu parsed %d parts %zu temp %s ext %s in %s\n",
                          wavvix::version(), port.value(), ours.size(), parsed.value_or(-1),
                          parts.size(), temporary.value_or("?").string().c_str(),
                          archive.extension().string().c_str(),
                          wavvix::format_duration(watch.elapsed()).c_str());
              return doubled_port(-1).is_err() ? 0 : 1;
          }
          CPP

      - name: configure the consumer
        working-directory: consumer
        run: xmake f -m release --toolchain=${{ matrix.platform.toolchain }} -y

      - name: build the consumer
        working-directory: consumer
        run: xmake -y

      - name: run the consumer
        working-directory: consumer
        run: xmake run consumer

      - name: inspect macOS consumer dependencies
        if: runner.os == 'macOS'
        working-directory: consumer
        run: otool -L build/macosx/*/release/consumer
