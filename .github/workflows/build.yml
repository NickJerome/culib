name: build

# README 的「平台与工具链」承诺三个平台行为一致、「开发约定」承诺零警告。
# 这个 workflow 是那两条承诺的执行机制 —— 手工只能覆盖一个平台一种编译器。
#
# 需要 GitHub 的托管 runner（ubuntu / windows / macos 三种标签）。主仓库在自建 Gitea 上时，
# 用 Gitea 的 Push Mirror 自动镜像到一个 GitHub 仓库来跑它，配置办法见
# docs/superpowers/specs/2026-10-03-roadmap.md 第 5 节。

on:
  push:
    # 两个都认：主仓库在 Gitea 上用 master，GitHub 的默认分支名是 main。
    # 只写一个的话，哪天分支改名 CI 就静默不跑了。
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  mingw-i686:
    name: MinGW i686 C++11
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          install: mingw-w64-i686-gcc
          suppress-deprecation-warnings: msystem-mingw32
      - name: build 32-bit tests and examples, run tests
        shell: msys2 {0}
        run: CXX=g++ bash .github/report-failure.sh bash tests/mingw_windows.sh i686

  mingw-x86_64:
    name: MinGW x86_64 C++11
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: build 64-bit tests and examples, run tests
        shell: msys2 {0}
        run: CXX=g++ bash .github/report-failure.sh bash tests/mingw_windows.sh x86_64

  legacy-gcc:
    name: GCC 4.8 C++11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build and test with GCC 4.8
        shell: bash
        run: bash .github/report-failure.sh docker run --rm -v "$PWD:/workspace" -w /workspace quay.io/pypa/manylinux1_x86_64@sha256:506d34897aa3e6f41297bb05e721f92b6cebd23966b5c3a36b015ec7ba5c764d bash tests/legacy_gcc48.sh

  # 两条开发约定原先只有人工流程、没有机制：公共头文件带 UTF-8 BOM、每个头文件能单独包含。
  # 都只需要一个 Linux runner，所以合成一个快速门禁，排在编译矩阵前面。
  headers:
    name: public headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 头文件里有中文注释。使用方在非 UTF-8 代码页（如中文 Windows 的 936）下不加 /utf-8
      # 编译时，MSVC 会对每个头文件报 C4819，开了 /WX 就是编译失败。BOM 让文件自己说明编码，
      # 不需要使用方加任何标志 —— culib 自己的 set_encodings("utf-8") 管不到使用方的编译单元。
      - name: every public header starts with a UTF-8 BOM
        run: |
          missing=$(find include -name '*.h' -print0 \
            | xargs -0 -I{} sh -c 'head -c3 "{}" | od -An -tx1 | tr -d " \n" | grep -q efbbbf || echo "{}"')
          if [ -n "$missing" ]; then
            echo "缺少 UTF-8 BOM："; echo "$missing"
            echo "修法：python3 -c \"import pathlib,sys; p=pathlib.Path(sys.argv[1]); b=p.read_bytes(); p.write_bytes(b'\\xef\\xbb\\xbf'+b)\" <文件>"
            exit 1
          fi
          echo "全部带 BOM：$(find include -name '*.h' | wc -l) 个"

      - name: every public header compiles on its own
        run: |
          status=0
          for header in $(find include -name '*.h' | sed 's|^include/||' | sort); do
            printf '#include <%s>\nint main() { return 0; }\n' "$header" > /tmp/standalone.cpp
            if g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror -Iinclude \
                   -fsyntax-only /tmp/standalone.cpp; then
              echo "  ok    $header"
            else
              echo "  FAIL  $header"; status=1
            fi
          done
          exit $status

  no-exceptions-rtti:
    name: Linux ${{ matrix.toolchain }} C++11 without exceptions or RTTI
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1.2.5
        with:
          xmake-version: latest
      - name: configure without exceptions or RTTI
        run: xmake f -m release --toolchain=${{ matrix.toolchain }} --cxxflags="-fno-exceptions -fno-rtti" --ccache=n -y
      - name: build library
        shell: bash
        run: bash .github/report-failure.sh xmake -w -y
      - name: run tests
        shell: bash
        run: bash .github/report-failure.sh xmake test -v
      - name: build examples
        shell: bash
        run: bash .github/report-failure.sh xmake build -w -y -g examples

  sanitizers:
    name: Linux GCC ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1.2.5
        with:
          xmake-version: latest
      - name: configure with sanitizers
        run: xmake f -m debug --toolchain=gcc --cxxflags="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" --ldflags="-fsanitize=address,undefined" --ccache=n -y
      - name: build library and tests
        shell: bash
        run: bash .github/report-failure.sh xmake build -w -y culib_test
      - name: run tests under ASan and UBSan
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: bash .github/report-failure.sh xmake test -v

  build:
    name: ${{ matrix.target.name }} / ${{ matrix.mode }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      # 一个平台失败不打断其他平台，一次就能看到全部结果
      fail-fast: false
      matrix:
        mode: [debug, release]
        target:
          - { name: linux-gcc, os: ubuntu-latest, toolchain: gcc }
          - { name: linux-clang, os: ubuntu-latest, toolchain: clang }
          - { name: linux-gcc-arm64, os: ubuntu-24.04-arm, toolchain: gcc }
          - { name: macos-clang, os: macos-latest, toolchain: clang }
          - { name: macos-clang-x86_64, os: macos-15-intel, toolchain: clang }
          - { name: windows-msvc, os: windows-latest, toolchain: msvc }
          - { name: windows-msvc-x86, os: windows-latest, toolchain: msvc, arch_arg: '-a x86' }

    steps:
      - uses: actions/checkout@v4

      # 注意仓库名是 github-action-setup-xmake，不是 setup-xmake（后者不存在）
      - uses: xmake-io/github-action-setup-xmake@v1.2.5
        with:
          xmake-version: latest

      - name: configure
        run: xmake f -m ${{ matrix.mode }} --toolchain=${{ matrix.target.toolchain }} ${{ matrix.target.arch_arg }} -y

      # 下面五步都经过 report-failure.sh：失败时把完整输出发成 annotation，否则从公开
      # API 那边看只有「exit code 1」，连哪个文件哪一行都不知道。原因写在那个脚本里。
      # 分成五步而不是合成一步，是因为「哪一步红的」本身就是诊断信息。

      # -w 显示警告。xmake.lua 已把警告设为错误（三个平台都是），所以这同时是零警告检查。
      - name: build library
        shell: bash
        run: bash .github/report-failure.sh xmake -w -y

      - name: run tests
        shell: bash
        # 有失败时 -v 打印完整报告
        run: bash .github/report-failure.sh xmake test -v

      # Linux 上即使 io_uring 可用，也强制跑一次 epoll，验证运行期退回路径。
      - name: run tests with epoll fallback
        if: startsWith(matrix.target.name, 'linux-')
        shell: bash
        run: WAVVIX_IO_BACKEND=epoll bash .github/report-failure.sh xmake test -v

      # 示例默认不参与构建，这里显式编译：接口改了而示例没跟着改时就会在这一步失败。
      # 这一步抓到过 examples/os.cpp 的 std::fopen 在 MSVC 上是 C4996。
      - name: build examples
        shell: bash
        run: bash .github/report-failure.sh xmake build -w -y -g examples

      - name: run examples
        shell: bash
        run: bash .github/report-failure.sh xmake run example_result

  # 确认 culib 被当作源码依赖引入时能正常工作。
  # 这覆盖 xmake.lua 里 is_main_project 为假的那条分支（不强加 -Werror、不构建测试和示例），
  # 以及 README「使用方也可以用更高的标准」这条说法 —— 两者手工都测不到。
  consumed-as-dependency:
    name: consumed as dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: culib

      # 注意仓库名是 github-action-setup-xmake，不是 setup-xmake（后者不存在）
      - uses: xmake-io/github-action-setup-xmake@v1.2.5
        with:
          xmake-version: latest

      - name: create a consumer project
        run: |
          mkdir -p consumer/src consumer/third_party
          cp -r culib consumer/third_party/culib
          rm -rf consumer/third_party/culib/.git consumer/third_party/culib/build
          cat > consumer/xmake.lua <<'LUA'
          add_rules("mode.debug", "mode.release")
          set_languages("c++17")   -- 使用方用比 culib 本身更高的标准

          includes("third_party/culib")

          target("consumer")
              set_kind("binary")
              add_files("src/*.cpp")
              add_deps("culib")
          LUA
          cat > consumer/src/main.cpp <<'CPP'
          #include <culib/culib.h>
          #include <cstdio>
          #include <string>
          #include <string_view>
          #include <type_traits>
          #include <utility>
          #include <vector>

          static wavvix::result<int> checked_port(int port) {
              if (port < 1 || port > 65535) {
                  return wavvix::make_error(wavvix::error_kind::out_of_range, "bad port");
              }
              return port;
          }

          // 错误传播手写 if，不用宏：曾经有个 WAVVIX_TRY，因为藏了一个 return 被删掉了
          static wavvix::result<int> doubled_port(int port) {
              wavvix::result<int> checked = checked_port(port);
              if (checked.is_err()) return std::move(checked).error();
              return checked.value() * 2;
          }

          int main() {
              defer { std::printf("done\n"); };
              wavvix::stopwatch watch;

              // 第一程的五个模块各用一下，确认它们在「C++17 使用方」这一侧也能用
              std::string_view standard = "from std::string_view";
              wavvix::string_view ours = standard;
              static_assert(!std::is_same<wavvix::string_view, std::string_view>::value,
                            "wavvix::string_view must stay a distinct type from std::string_view");

              const wavvix::result<int> parsed = wavvix::lexical_cast<int>("42");
              const std::vector<wavvix::string_view> parts = wavvix::split("a,b,c", ',');
              const wavvix::result<std::string> temporary = wavvix::fs::temp_directory();
              const wavvix::string_view suffix = wavvix::fs::extension("archive.tar.gz");

              const wavvix::result<int> port = doubled_port(8080);
              if (port.is_err()) {
                  std::fprintf(stderr, "%s\n", port.error().to_string().c_str());
                  return 1;
              }
              std::printf("culib %s port %d view %zu parsed %d parts %zu temp %s ext %s in %s\n",
                          wavvix::version(), port.value(), ours.size(), parsed.value_or(-1),
                          parts.size(), temporary.value_or("?").c_str(),
                          suffix.to_string().c_str(),
                          wavvix::format_duration(watch.elapsed()).c_str());
              return doubled_port(-1).is_err() ? 0 : 1;
          }
          CPP

      - name: build and run the consumer
        run: |
          cd consumer
          xmake f -m release -y
          xmake -w -y
          xmake run consumer
